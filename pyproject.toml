[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag-agent"
version = "0.1.0"
description = "MedRAG-Agent (dependency manifest; install via conda environment.yml)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "qdrant-client>=1.12",
  # NOTE: sentence-transformers intentionally omitted. We use FlagEmbedding's
  # BGEM3FlagModel and FlagReranker directly, which bypass sentence_transformers
  # entirely. Including it pulls in datasets+pyarrow which cause Windows access
  # violation crashes in some envs (see _smoke_bge_only.py). Add back if needed.
  "FlagEmbedding>=1.3",
  "torch>=2.6",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "biopython>=1.84",
  "pymupdf>=1.24",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "ipykernel",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
