[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag-agent"
version = "0.1.0"
description = "VeritasMed medical literature RAG agent — install deps with pip install -e ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # ── ML / retrieval (runtime) ─────────────────────────────────────────────
  "torch>=2.6",
  "numpy>=1.26",
  "sentence-transformers>=3.0",   # app.py preload; BGEReranker cross-encoder
  "FlagEmbedding>=1.3",             # BGEM3Embedder; scripts/04_build_index
  "qdrant-client>=1.12",
  # ── LangGraph agent + LLM ──────────────────────────────────────────────────
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",          # LLM_BACKEND=ollama; HyDE / multi-query retrievers
  "openai>=1.30",                   # eval scripts judge client
  # ── API + MCP ─────────────────────────────────────────────────────────────
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "fastmcp>=2.0",
  "pydantic>=2.7",
  "pyarrow>=15.0",                  # Windows import-order guard (MCP / scripts)
  # ── Ingest + utilities ─────────────────────────────────────────────────────
  "biopython>=1.84",                # PubMed / PMC Entrez
  "httpx>=0.27",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "ipykernel",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
