version: "3.9"

# MedRAG-Agent — one-command local deployment
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f ui     # follow UI logs
#   docker compose down           # stop all

services:

  # ── Vector database ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: medrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LLM inference (Qwen3-8B via Ollama) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: medrag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # Pull Qwen3-8B on first start (runs in background — takes ~5 min)
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull qwen3:8b &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Streamlit UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medrag-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Mount corpus data so the container can access the index
      - ./data:/app/data:ro
      # Mount model cache to avoid re-downloading BGE-M3 each restart
      - model_cache:/root/.cache/huggingface
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  qdrant_data:
  ollama_data:
  model_cache:
